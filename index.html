    <script>
      (function () {
        try {
          var saved = localStorage.getItem('najm_theme') || localStorage.getItem('naghma_theme');
          var theme = saved === 'dark' ? 'dark' : 'light';
          var root = document.documentElement;
          if (theme === 'dark') {
            root.classList.add('dark');
          } else {
            root.classList.remove('dark');
          }
          var savedLang = localStorage.getItem('najm_lang') || localStorage.getItem('naghma_lang');
          var lang = savedLang === 'ar' ? 'ar' : savedLang === 'fr' ? 'fr' : 'en';
          root.lang = lang;
          root.dir = lang === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {}
      })();
    </script>
