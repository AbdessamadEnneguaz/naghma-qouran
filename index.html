<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Naghma Quran (نَغمة القرآن) — Holy Quran & Madani Mushaf</title>
    <meta
      name="description"
      content="Offline-first Holy Quran reader & 604-page Madani Mushaf with Hafs & Warsh narrations, 25+ reciters, ayah-synced audio, and Tafsir Al-Muyassar."
    />
    <meta property="og:title" content="Naghma Quran (نَغمة القرآن) — Holy Quran & Madani Mushaf" />
    <meta
      property="og:description"
      content="Offline-first Holy Quran reader & 604-page Madani Mushaf with Hafs & Warsh narrations, 25+ reciters, ayah-synced audio, and Tafsir Al-Muyassar."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0B0E11" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Naghma" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Scheherazade+New:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('naghma_theme') || localStorage.getItem('noor_theme');
          var theme = saved === 'light' ? 'light' : 'dark';
          var root = document.documentElement;
          if (theme === 'dark') {
            root.classList.add('dark');
          } else {
            root.classList.remove('dark');
          }
          var savedLang = localStorage.getItem('naghma_lang') || localStorage.getItem('noor_lang');
          var lang = savedLang === 'ar' ? 'ar' : 'en';
          root.lang = lang;
          root.dir = lang === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAF6EE] text-[#1C1917] dark:bg-[#0B0E11] dark:text-[#F4F1EA] antialiased selection:bg-[#D4AF37]/30">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
